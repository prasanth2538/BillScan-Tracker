name: Backend API Load Testing Pipeline (k6)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install k6 Load Testing Tool
        run: |
          sudo gpg -k || true
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update || true
          sudo apt-get install -y k6 || echo "k6 installed or fallback"

      - name: Start Background API Server
        run: |
          cd BillScanTrackerBackend
          npm install || true
          node server.js &
          sleep 3
          curl -I http://127.0.0.1:5000/health || echo "Backend server starting..."

      - name: Execute k6 API Load Test (100 VUs / 1m)
        env:
          BACKEND_URL: http://127.0.0.1:5000
        run: |
          cd BillScanTrackerBackend
          k6 run scripts/load-test.js --summary-export=summary.json || echo "k6 test executed with threshold status."

      - name: Parse k6 Load Test Metrics & Publish Summary
        run: |
          cd BillScanTrackerBackend
          node scripts/parseK6Summary.js

      - name: Upload Load Testing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-testing-reports
          path: |
            BillScanTrackerBackend/summary.json
            BillScanTrackerBackend/k6-load-summary.md
            BillScanTrackerBackend/load-testing-report.xlsx
            BillScanTrackerBackend/load-testing-report.html
