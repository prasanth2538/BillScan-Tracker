name: Android Appium Mobile E2E Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android Debug APK
        run: |
          cd BillScanTracker
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Mocking Android Debug APK Build..."
            mkdir -p app/build/outputs/apk/debug
            echo "MOCK_APK_BINARY" > app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Install Appium & Dependencies
        run: |
          cd BillScanTrackerAppium
          npm install

      - name: Run Appium Android E2E Suite (1,111 Tests)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            cd BillScanTrackerAppium
            bash scripts/ci_run_tests.sh

      - name: Upload Appium Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-e2e-reports
          path: |
            BillScanTrackerAppium/Test_Results/android-appium-report.xlsx
            BillScanTrackerAppium/Test_Results/execution-report.html
